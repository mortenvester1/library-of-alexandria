; Prometheus scrape endpoint for apps/monitoring.
;
; Kept out of 00-livesync.ini on purpose: that file is a verbatim transcription of
; provision.ts and must stay re-diffable against upstream. Nothing here is a
; LiveSync requirement.
;
; Sorts after 00-livesync.ini and before the entrypoint's writable docker.ini, so
; the config-API target is unchanged.

[prometheus]
; Opens a second listener serving only GET /_node/{node}/_prometheus, with no
; authentication — every other path on it 404s
; (src/couch_prometheus/src/couch_prometheus_http.erl). It is deliberately absent
; from the compose `ports` list, so it exists only on Docker networks: Alloy can
; reach it, the LAN cannot. The authenticated endpoint on 5984 is the same data
; and needs none of this, but would put admin credentials in apps/monitoring/.env.
additional_port = true
; Container-internal; 127.0.0.1 (the default) would be unreachable from Alloy.
bind_address = 0.0.0.0
port = 17986
