; Server-level settings Obsidian Self-hosted LiveSync requires.
;
; Transcribed verbatim from the settings table in the plugin's own provisioning
; tool, so this file replaces the `couchdb-init.sh` / Deno step in
; https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md
;   https://github.com/vrtmrz/obsidian-livesync/blob/main/utils/couchdb/provision.ts
;
; Mounted read-only at /opt/couchdb/etc/local.d/00-livesync.ini. The `00-` prefix
; matters: CouchDB reads local.d/*.ini in filename order and writes config changes
; to the LAST file, which must stay the entrypoint's writable docker.ini. For the
; same reason this file deliberately sets no [admins], no [chttpd] bind_address
; and no [couchdb] uuid — those are docker.ini's keys.

[couchdb]
; Stands in for provision.ts's POST /_cluster_setup enable_single_node: creates
; _users / _replicator / _global_changes on startup. Must be false if this ever
; becomes a real cluster.
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
; So /_up stays anonymous for the healthcheck and any external probe.
require_valid_user_except_for_up = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
credentials = true
; Exact list from provision.ts — app://obsidian.md is desktop, capacitor://localhost
; is mobile. Dropping either silently breaks that platform.
origins = app://obsidian.md,capacitor://localhost,http://localhost
