name: seafile

# Seafile Server Community Edition 13 — self-hosted file sync/share (Dropbox replacement).
#
# Merged from the three upstream 13.0 assets so this stack is one file like the
# rest of apps/:
#   https://manual.seafile.com/13.0/repo/docker/ce/seafile-server.yml
#   https://manual.seafile.com/13.0/repo/docker/caddy.yml      (dropped, see below)
#   https://manual.seafile.com/13.0/repo/docker/seadoc.yml     (dropped, see below)
#
# Deliberate deltas from upstream, so a version bump stays a clean re-diff:
#   - top-level `name:`; upstream's external `seafile-net` replaced by the
#     implicit project network
#   - caddy.yml and seadoc.yml omitted. Caddy exists only to path-route SeaDoc
#     (/sdoc-server, /socket.io) and would want :80/:443, which apps/plane holds.
#     Dropping it also drops a /var/run/docker.sock mount. SeaDoc is collaborative
#     document editing, not sync — ENABLE_SEADOC is forced false below. To get it
#     back, re-vendor both upstream files instead of hand-rolling the routing.
#   - seafile's `ports` uncommented and published on SEAFILE_HTTP_PORT
#   - floating `13.0-latest` / bare `redis` pinned to exact tags
#   - `:?` guards on the host paths and REDIS_PASSWORD (upstream defaults to /opt
#     and to an empty password)
#
#   cp .env.example .env   # then fill in the guarded values
#   docker compose up -d
#   docker compose logs -f seafile
#
# Logs and cAdvisor container metrics arrive via the Docker socket that
# apps/monitoring holds and need no network attachment. The seafile service also
# joins `monitoring` for Seahub's own /metrics, which stays dark until
# ENABLE_METRIC is set in seahub_settings.py — see the notes in .env.example.
# MariaDB and Redis expose no metrics of their own; that would need exporter
# sidecars this stack deliberately does not run.

services:
  db:
    image: ${SEAFILE_DB_IMAGE:-mariadb:10.11}
    container_name: seafile-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${SEAFILE_MYSQL_VOLUME:?set SEAFILE_MYSQL_VOLUME}:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  redis:
    image: ${SEAFILE_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: seafile-redis
    restart: unless-stopped
    # `$$` is compose escaping for a literal `$` — the shell inside the container
    # expands REDIS_PASSWORD, not compose. Keep it on any edit.
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  seafile:
    image: ${SEAFILE_IMAGE:-seafileltd/seafile-mc:13.0.25}
    container_name: seafile
    restart: unless-stopped
    ports:
      # Container-internal nginx is always :80; only the host side is variable.
      # SEAFILE_SERVER_HOSTNAME must carry this same port or uploads break.
      - "0.0.0.0:${SEAFILE_HTTP_PORT:-8088}:80"
    volumes:
      - ${SEAFILE_VOLUME:?set SEAFILE_VOLUME}:/shared
    environment:
      - SEAFILE_MYSQL_DB_HOST=${SEAFILE_MYSQL_DB_HOST:-db}
      - SEAFILE_MYSQL_DB_PORT=${SEAFILE_MYSQL_DB_PORT:-3306}
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER:-seafile}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD:?set SEAFILE_MYSQL_DB_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}
      - TIME_ZONE=${TIME_ZONE:-Europe/Copenhagen}
      - INIT_SEAFILE_ADMIN_EMAIL=${INIT_SEAFILE_ADMIN_EMAIL:?set INIT_SEAFILE_ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${INIT_SEAFILE_ADMIN_PASSWORD:?set INIT_SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME:?set SEAFILE_SERVER_HOSTNAME}
      - SEAFILE_SERVER_PROTOCOL=${SEAFILE_SERVER_PROTOCOL:-http}
      - SITE_ROOT=${SITE_ROOT:-/}
      - NON_ROOT=${NON_ROOT:-false}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY}
      - SEAFILE_LOG_TO_STDOUT=${SEAFILE_LOG_TO_STDOUT:-true}
      - ENABLE_GO_FILESERVER=${ENABLE_GO_FILESERVER:-true}
      # SeaDoc needs the dropped caddy/seadoc services; leaving it true yields a
      # doc editor that 404s.
      - ENABLE_SEADOC=false
      - CACHE_PROVIDER=${CACHE_PROVIDER:-redis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - ENABLE_NOTIFICATION_SERVER=false
      - ENABLE_SEAFILE_AI=false
      - ENABLE_FACE_RECOGNITION=false
      - MD_FILE_COUNT_LIMIT=${MD_FILE_COUNT_LIMIT:-100000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      # `default` must stay listed — naming any network drops the implicit one,
      # and Seahub resolves `db` and `redis` on the project network.
      default: {}
      monitoring:
        aliases:
          - seafile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  # Created outside this stack (docker network create monitoring); shared with
  # apps/monitoring so Alloy can scrape Seahub's /metrics.
  monitoring:
    external: true
