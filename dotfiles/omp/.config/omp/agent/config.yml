memory: 
  backend: mnemopi
mnemopi: 
  scoping: per-project
autolearn: 
  enabled: true
statusLine: 
  preset: custom
  separator: none
  leftSegments: 
    - hostname
    - model
    - mode
    - path
    - git
  rightSegments: 
    - context_pct
    - token_total
    - cost
  segmentOptions: 
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    context_pct: 
      bar: true
  sessionAccent: true
  transparent: true
  compactThinkingLevel: false
  showHookStatus: false
theme: 
  dark: dark-dracula
terminal: 
  showProgress: true
tui: 
  textSizing: false
  renderMermaid: true
  titleState: true
  tight: true
display: 
  shimmer: classic
  showTokenUsage: true
  cacheMissMarker: false
  collapseCompacted: true
hideThinkingBlock: true
advisor: 
  enabled: true
doubleEscapeAction: tree
composer: 
  shape: pi